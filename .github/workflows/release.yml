name: Release plugin

on:
    push:
        tags:
            - "v*.*.*"
    workflow_dispatch:
        inputs:
            tag:
                description: "Release tag to build, for example v1.2.0"
                required: true
                type: string

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
            - name: Resolve release version
              id: release
              env:
                  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
              run: |
                  echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
                  echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20.x
                  cache: "npm"
            - run: npm ci
            - run: npm run verify:version -- "${{ steps.release.outputs.version }}"
            - run: npm run build
            - run: npm run lint
            - run: npm test
            - name: Package plugin files
              run: zip -j "obsidian-wechat-publish-${{ steps.release.outputs.version }}.zip" main.js manifest.json styles.css mathjax-svg.js
            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.release.outputs.tag }}
                  files: obsidian-wechat-publish-${{ steps.release.outputs.version }}.zip
