name: Release plugin

on:
    push:
        tags:
            - "v*.*.*"

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20.x
                  cache: "npm"
            - run: npm ci
            - run: npm run verify:version -- "${GITHUB_REF_NAME#v}"
            - run: npm run build
            - run: npm run lint
            - run: npm test
            - name: Package plugin files
              run: zip -j "obsidian-wechat-publish-${GITHUB_REF_NAME#v}.zip" main.js manifest.json styles.css mathjax-svg.js
            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  files: obsidian-wechat-publish-${GITHUB_REF_NAME#v}.zip
